name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff bandit

      - name: ruff lint
        run: ruff check app.py models.py --output-format=github

      - name: bandit SAST
        run: bandit -r app.py models.py -ll

  # ── Job 2: Unit Tests ─────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: sqlite:///test_daily_report.db
      SECRET_KEY: ci-test-secret-key
      TESTING: "1"
      BANK_ENCRYPT_KEY: ""
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.xml

  # ── Job 3: Integration Tests ──────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    env:
      DATABASE_URL: sqlite:///test_daily_report.db
      SECRET_KEY: ci-test-secret-key
      TESTING: "1"
      BANK_ENCRYPT_KEY: ""
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short --cov=app --cov-report=xml --cov-fail-under=40

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: integ-coverage
          path: coverage.xml

  # ── Job 4: Security Scan ──────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: bandit full report
        run: bandit -r app.py models.py -ll -f json -o bandit-report.json
        continue-on-error: true

      - name: safety CVE check
        run: |
          pip install -r requirements.txt
          safety check --continue-on-error

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: "*.json"

  # ── Job 5: Deploy to Production ──────────────────────────────────────────
  # Requires manual approval via GitHub Environment Protection Rule on 'production'
  prod-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway production deploy
        run: |
          echo "Deploy triggered for commit ${{ github.sha }}"
          # Uncomment and configure when Railway secrets are set:
          # curl -s "https://backboard.railway.app/graphql/v2" \
          #   -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"query":"mutation { deploymentTrigger(input:{environmentId:\"${{ secrets.RAILWAY_PROD_ENV_ID }}\"}){id}}"}'

  # ── Job 6: Smoke Test ─────────────────────────────────────────────────────
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: prod-deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Health check
        run: |
          if [ -z "${{ secrets.PROD_URL }}" ]; then
            echo "PROD_URL not set — skipping smoke test"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_URL }}/login")
          echo "Production /login returned HTTP $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] || exit 1
